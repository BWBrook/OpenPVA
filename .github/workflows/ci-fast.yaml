name: ci-fast

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_PAK_ENABLED: "FALSE"
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgit2-dev \
            libglpk-dev \
            libx11-dev \
            pandoc

      - name: Install renv
        run: Rscript -e "install.packages('renv', repos = 'https://cloud.r-project.org')"

      - name: Restore dependencies
        run: >-
          Rscript -e "options(renv.config.pak.enabled = FALSE);
          renv::restore(prompt = FALSE)"

      - name: Ensure suggested packages
        run: >-
          Rscript -e "desc <- read.dcf('DESCRIPTION');
          suggests <- trimws(unlist(strsplit(desc[1, 'Suggests'], ',')));
          suggests <- gsub('\\s*\\(.*\\)$', '', suggests);
          suggests <- suggests[nzchar(suggests)];
          missing <- suggests[!vapply(suggests, requireNamespace, FUN.VALUE = logical(1), quietly = TRUE)];
          if (length(missing) > 0) {
          message('Installing missing Suggests: ', paste(missing, collapse = ', '));
          install.packages(missing, repos = 'https://cloud.r-project.org')
          } else {
          message('All Suggests already installed.')
          }"

      - name: Lint package
        run: Rscript -e "lints <- lintr::lint_package(); print(lints); if (length(lints) > 0) quit(status = 1)"

      - name: Run tests
        run: Rscript -e "devtools::test()"

      - name: Build source tarball
        run: R CMD build --no-build-vignettes .

      - name: Run R CMD check (fast profile)
        run: R CMD check --no-manual OpenPVA_*.tar.gz
