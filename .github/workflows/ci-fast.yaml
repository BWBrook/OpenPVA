name: Package check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        r: [release]
        include:
          - os: ubuntu-24.04
            r: '4.1.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Install Linux test build headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libuv1-dev
      - name: Install test dependencies
        run: Rscript --vanilla -e 'install.packages("testthat", repos = "https://cloud.r-project.org"); stopifnot(requireNamespace("testthat", quietly = TRUE))'
      - name: Build and check
        run: |
          R CMD build --no-build-vignettes .
          R CMD check --as-cran --no-manual OpenPVA_*.tar.gz
          if grep -Eq '^Status:.*(ERROR|WARNING)' OpenPVA.Rcheck/00check.log; then exit 1; fi
      - name: Verify the minimum interpreter and clean socket workers
        if: matrix.r == '4.1.0'
        run: |
          mkdir -p "$RUNNER_TEMP/openpva-floor"
          R CMD INSTALL --library="$RUNNER_TEMP/openpva-floor" OpenPVA_*.tar.gz
          Rscript --vanilla scripts/check_r_floor.R "$RUNNER_TEMP/openpva-floor"
