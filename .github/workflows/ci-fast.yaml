name: ci-fast

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_PAK_ENABLED: "FALSE"
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      RENV_CONFIG_REPOS_OVERRIDE: "https://cloud.r-project.org"
      RENV_CONFIG_PPM_ENABLED: "FALSE"
      RENV_CONFIG_RSPM_ENABLED: "FALSE"
      R_PKG_TYPE: "source"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgit2-dev \
            libglpk-dev \
            libx11-dev \
            pandoc

      - name: Install renv
        run: Rscript scripts/install_renv.R

      - name: Restore dependencies
        run: Rscript scripts/ci_restore.R

      - name: Ensure suggested packages
        run: Rscript scripts/install_suggests.R

      - name: Lint package
        run: Rscript -e "lints <- lintr::lint_package(); print(lints); if (length(lints) > 0) quit(status = 1)"

      - name: Run tests
        run: Rscript scripts/run_tests.R

      - name: Build source tarball
        run: R CMD build --no-build-vignettes .

      - name: Run R CMD check (fast profile)
        run: R CMD check --no-manual OpenPVA_*.tar.gz
