name: ci-heavy-validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  heavy_validation:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_PAK_ENABLED: "FALSE"
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      RENV_CONFIG_REPOS_OVERRIDE: "https://cloud.r-project.org"
      RENV_CONFIG_PPM_ENABLED: "FALSE"
      RENV_CONFIG_RSPM_ENABLED: "FALSE"
      R_PKG_TYPE: "source"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgit2-dev \
            libglpk-dev \
            libuv1-dev \
            libx11-dev \
            pandoc

      - name: Install renv
        run: Rscript scripts/install_renv.R

      - name: Restore dependencies
        run: Rscript scripts/ci_restore.R

      - name: Build source tarball
        run: R CMD build --no-build-vignettes .

      - name: Run R CMD check (heavy profile)
        run: R CMD check --no-manual --as-cran OpenPVA_*.tar.gz
