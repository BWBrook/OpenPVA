name: "demo_demography"
schema_version: 1
n_runs: 30
n_years: 50
seed: 20260305

initializer:
  fun: "initialize_population"
  args:
    "n": 80

demography:
  survival:
    table:
      - sex: "F"
        age_min: 0
        age_max: 0
        p_surv: 0.8
      - sex: "F"
        age_min: 1
        age_max: 4
        p_surv: 0.92
      - sex: "F"
        age_min: 5
        age_max: 100
        p_surv: 0.7
      - sex: "M"
        age_min: 0
        age_max: 0
        p_surv: 0.8
      - sex: "M"
        age_min: 1
        age_max: 4
        p_surv: 0.92
      - sex: "M"
        age_min: 5
        age_max: 100
        p_surv: 0.7

  breeding:
    table:
      - sex: "F"
        age_min: 4
        age_max: 100
        can_breed: true
      - sex: "M"
        age_min: 0
        age_max: 100
        can_breed: false

  fecundity:
    table:
      - sex: "F"
        age_min: 4
        age_max: 100
        lambda: 1.5
      - sex: "M"
        age_min: 0
        age_max: 100
        lambda: 0

env_surv_sd: 0.2
cat_surv_prob: 0.05
cat_surv_mult: 0.3

K: 100
lifecycle_steps:
  - age
  - survival
  - breeding_births
  - harvest

management:
  harvest_quota: 2
