name: "demo_reproduction_v2"
schema_version: 3
n_runs: 6
n_years: 10
seed: 20260308

initializer:
  fun: "initialize_population"
  args:
    "n": 40

survival_fun: "default_survival_fun"

demography:
  breeding_prob:
    table:
      - sex: "F"
        age_min: 0
        age_max: 2
        p_breed: 0.00
      - sex: "F"
        age_min: 3
        age_max: 100
        p_breed: 0.65
      - sex: "M"
        age_min: 0
        age_max: 100
        p_breed: 0.00
  fecundity_lambda:
    table:
      - sex: "F"
        age_min: 0
        age_max: 2
        lambda: 0.0
      - sex: "F"
        age_min: 3
        age_max: 100
        lambda: 1.4
      - sex: "M"
        age_min: 0
        age_max: 100
        lambda: 0.0

reproduction_ev:
  env_repro_p_sd: 0.15
  env_repro_lambda_sd: 0.10
  cat_repro_prob: 0.10
  cat_repro_mult: 0.50

env_surv_sd: 0.1
cat_surv_prob: 0.05
cat_surv_mult: 0.4

density:
  survival:
    model: ceiling
    K: 70
lifecycle_steps:
  - age
  - survival
  - breeding_births
  - harvest

management:
  harvest_quota: 1
