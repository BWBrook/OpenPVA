name: "demo_density_v2"
schema_version: 3
n_runs: 8
n_years: 12
seed: 20260209

initializer:
  fun: "initialize_population"
  args:
    "n": 60

survival_fun: "default_survival_fun"

demography:
  breeding_prob:
    table:
      - sex: "F"
        age_min: 0
        age_max: 2
        p_breed: 0.00
      - sex: "F"
        age_min: 3
        age_max: 100
        p_breed: 0.70
      - sex: "M"
        age_min: 0
        age_max: 100
        p_breed: 0.00
  fecundity_lambda:
    table:
      - sex: "F"
        age_min: 0
        age_max: 2
        lambda: 0.0
      - sex: "F"
        age_min: 3
        age_max: 100
        lambda: 1.4
      - sex: "M"
        age_min: 0
        age_max: 100
        lambda: 0.0

reproduction_ev:
  env_repro_p_sd: 0.10
  env_repro_lambda_sd: 0.10
  cat_repro_prob: 0.08
  cat_repro_mult: 0.60

env_surv_sd: 0.10
cat_surv_prob: 0.05
cat_surv_mult: 0.50

density:
  survival:
    model: ceiling
    K: 55
  breeding:
    model: constant
    multiplier: 0.90
  fecundity:
    model: constant
    multiplier: 0.85

lifecycle_steps:
  - age
  - survival
  - breeding_births
  - harvest

management:
  harvest_quota: 1
